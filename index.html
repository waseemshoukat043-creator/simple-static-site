
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Static Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #eff6ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            max-width: 550px;
            width: 100%;
            padding: 45px 30px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2563eb;
            margin-bottom: 18px;
            font-size: 34px;
        }

        p {
            color: #475569;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 13px 25px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 28px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Welcome to My Website!</h1>

        <p>
            This is my first static website.
            I created it using HTML and CSS
            and will deploy it on Vercel.
        </p>

        <a href="https://vercel.com" target="_blank">
            Explore Vercel
        </a>

        <footer>
            &copy; 2026 My Static Website
        </footer>
    </div>
</body>
</html>
